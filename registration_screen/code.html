<!DOCTYPE html>

<html class="light" lang="en">

<head>
	<meta charset="utf-8" />
	<meta content="width=device-width, initial-scale=1.0" name="viewport" />
	<title>Create Your Account</title>
	<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
	<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700;800;900&amp;display=swap"
		rel="stylesheet" />
	<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
	<link href="style.css" rel="stylesheet" />
	<script src="../config.js"></script>
	<script src="script.js"></script>
</head>

<body class="font-display bg-background-light dark:bg-background-dark text-text-light dark:text-text-dark">
	<div class="relative flex min-h-screen w-full flex-col items-center justify-center overflow-x-hidden p-4 md:p-8">
		<!-- Background Image -->
		<div class="absolute inset-0 z-0 opacity-5 dark:opacity-[0.02]">
			<img class="h-full w-full object-cover" data-alt="Abstract white architectural lines on a dark background"
				src="../images/registration-background.jpg" />
		</div>
		<div class="relative z-10 flex w-full max-w-lg flex-col items-center">
			<!-- Logo -->
			<div class="mb-6 flex items-center gap-3">
				<span class="material-symbols-outlined text-primary text-4xl">flight_takeoff</span>
				<span class="text-2xl font-bold tracking-tight text-text-light dark:text-text-dark">BoardingPass</span>
			</div>
			<!-- Card Container -->
			<div
				class="w-full rounded-xl border border-border-light dark:border-border-dark bg-white/50 dark:bg-background-dark/50 p-6 shadow-lg backdrop-blur-sm sm:p-8">
				<!-- Heading -->
				<div class="mb-6 text-center">
					<h1 class="text-3xl font-black tracking-tighter text-text-light dark:text-text-dark">Create Your
						Account</h1>
					<p class="mt-2 text-base text-gray-600 dark:text-gray-400">Join us to manage your boarding tickets
						with ease.</p>
				</div>
				<!-- Form -->
				<form action="#" class="space-y-4" method="POST">
					<div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
						<!-- First Name -->
						<div>
							<label class="block text-sm font-medium text-text-light dark:text-text-dark pb-1.5"
								for="first-name">First Name</label>
							<input
								class="form-input block w-full rounded-lg border-border-light bg-background-light p-3 text-sm text-text-light placeholder:text-gray-500 focus:border-primary focus:ring-primary dark:border-border-dark dark:bg-gray-800 dark:text-text-dark dark:placeholder:text-gray-400"
								id="first-name" name="first-name" placeholder="Enter your first name" type="text" />
						</div>
						<!-- Last Name -->
						<div>
							<label class="block text-sm font-medium text-text-light dark:text-text-dark pb-1.5"
								for="last-name">Last Name</label>
							<input
								class="form-input block w-full rounded-lg border-border-light bg-background-light p-3 text-sm text-text-light placeholder:text-gray-500 focus:border-primary focus:ring-primary dark:border-border-dark dark:bg-gray-800 dark:text-text-dark dark:placeholder:text-gray-400"
								id="last-name" name="last-name" placeholder="Enter your last name" type="text" />
						</div>
					</div>
					<!-- Email Address -->
					<div>
						<label class="block text-sm font-medium text-text-light dark:text-text-dark pb-1.5"
							for="email">Email Address</label>
						<div class="relative">
							<input
								class="form-input block w-full rounded-lg border-border-light bg-background-light p-3 pl-10 text-sm text-text-light placeholder:text-gray-500 focus:border-primary focus:ring-primary dark:border-border-dark dark:bg-gray-800 dark:text-text-dark dark:placeholder:text-gray-400"
								id="email" name="email" placeholder="you@example.com" type="email" />
							<div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3">
								<span class="material-symbols-outlined text-gray-400 text-base">mail</span>
							</div>
						</div>
						<!-- Error Message Example -->
						<p class="mt-1.5 text-xs text-error">Please enter a valid email address.</p>
					</div>
					<!-- Phone Number -->
					<div>
						<label class="block text-sm font-medium text-text-light dark:text-text-dark pb-1.5"
							for="phone">Phone Number</label>
						<input
							class="form-input block w-full rounded-lg border-border-light bg-background-light p-3 text-sm text-text-light placeholder:text-gray-500 focus:border-primary focus:ring-primary dark:border-border-dark dark:bg-gray-800 dark:text-text-dark dark:placeholder:text-gray-400"
							id="phone" name="phone" placeholder="+1 (555) 000-0000" type="tel" />
					</div>
					<!-- ID Number -->
					<div>
						<label class="block text-sm font-medium text-text-light dark:text-text-dark pb-1.5"
							for="id-number">National ID / Passport Number</label>
						<input
							class="form-input block w-full rounded-lg border-border-light bg-background-light p-3 text-sm text-text-light placeholder:text-gray-500 focus:border-primary focus:ring-primary dark:border-border-dark dark:bg-gray-800 dark:text-text-dark dark:placeholder:text-gray-400"
							id="id-number" name="id-number" placeholder="Enter your ID number" type="text" />
					</div>
					<!-- Password -->
					<div>
						<label class="block text-sm font-medium text-text-light dark:text-text-dark pb-1.5"
							for="password">Password</label>
						<div class="relative">
							<input
								class="form-input block w-full rounded-lg border-border-light bg-background-light p-3 pr-10 text-sm text-text-light placeholder:text-gray-500 focus:border-primary focus:ring-primary dark:border-border-dark dark:bg-gray-800 dark:text-text-dark dark:placeholder:text-gray-400"
								id="password" name="password" placeholder="Enter a strong password" type="password" />
							<button aria-label="Toggle password visibility"
								class="absolute inset-y-0 right-0 flex items-center pr-3" type="button">
								<span class="material-symbols-outlined text-gray-500 text-base">visibility</span>
							</button>
						</div>
					</div>
					<!-- Password Strength Indicator -->
					<div class="flex items-center gap-3 pt-1">
						<div class="h-1.5 flex-1 overflow-hidden rounded-full bg-gray-200 dark:bg-gray-700">
							<div class="h-full w-1/3 rounded-full bg-error"></div>
						</div>
						<span class="text-xs font-medium text-error">Weak</span>
					</div>
					<!-- Confirm Password -->
					<div>
						<label class="block text-sm font-medium text-text-light dark:text-text-dark pb-1.5"
							for="confirm-password">Confirm Password</label>
						<input
							class="form-input block w-full rounded-lg border-border-light bg-background-light p-3 text-sm text-text-light placeholder:text-gray-500 focus:border-primary focus:ring-primary dark:border-border-dark dark:bg-gray-800 dark:text-text-dark dark:placeholder:text-gray-400"
							id="confirm-password" name="confirm-password" placeholder="Re-enter your password"
							type="password" />
					</div>
					<!-- Terms of Service -->
					<div class="flex items-start pt-2">
						<div class="flex h-5 items-center">
							<input
								class="h-4 w-4 rounded border-gray-300 text-primary focus:ring-primary dark:bg-gray-700 dark:border-gray-600"
								id="terms" name="terms" type="checkbox" />
						</div>
						<div class="ml-3 text-sm">
							<label class="text-gray-600 dark:text-gray-400" for="terms">I agree to the
								<a class="font-medium text-primary hover:underline" href="#">Terms of Service</a> and
								<a class="font-medium text-primary hover:underline" href="#">Privacy Policy</a>.
							</label>
						</div>
					</div>
					<!-- Submit Button -->
					<div class="pt-4">
						<button
							class="flex w-full justify-center rounded-lg bg-primary px-4 py-3 text-sm font-semibold text-white shadow-sm transition hover:bg-primary/90 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary"
							type="submit">
							Create Account
						</button>
					</div>
				</form>
				<!-- Sign In Link -->
				<div class="mt-6 text-center text-sm">
					<p class="text-gray-600 dark:text-gray-400">
						Already have an account?
						<a class="font-medium text-primary hover:underline" href="../login_screen/code.html">Sign In</a>
					</p>
				</div>
			</div>
		</div>
	</div>
</body>

</html>
